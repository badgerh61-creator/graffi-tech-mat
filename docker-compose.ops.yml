version: "3.9"

services:
  api:
    build: .
    command: ["bash", "-lc", "cd backend && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"

    # Important: point SQLite to backend path
    environment:
      - DATABASE_URL=sqlite:///backend/graffi.db
      - JWT_SECRET=${JWT_SECRET:-dev-only}

    # 🔒 PERSISTENT DATABASE (Mode 2)
    volumes:
      # host file              # container file
      - ./backend/graffi.db:/app/backend/graffi.db

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: .
    command: ["bash", "-lc", "cd backend && python -m app.workers.run"]
    depends_on:
      - api

  scheduler:
    build: .
    command: ["bash", "-lc", "cd backend && python -m app.scheduler.run"]
    depends_on:
      - api
