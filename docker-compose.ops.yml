services:
  api:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      # Force sqlite for ops mode (overrides .env DATABASE_URL)
      - DATABASE_URL=sqlite:///backend/graffi.db

      # Make broker hostname match this compose file
      - CELERY_BROKER_URL=redis://redis:6379/0

      # Make S3 endpoint hostname match this compose file
      - S3_ENDPOINT_URL=http://minio:9000

      # If your app uses MINIO_* vars, force them too
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - MINIO_BUCKET=${MINIO_BUCKET:-graffi-assets}

    volumes:
      - ./backend/graffi.db:/app/backend/graffi.db

    depends_on:
      - redis
      - minio

  redis:
    image: redis:7-alpine

  minio:
    image: quay.io/minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
